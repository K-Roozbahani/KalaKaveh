version: "3.9"

services:

  postgres:

    image: postgres:17

    container_name: onlineshop_postgres

    restart: unless-stopped

    env_file:
      - ./deployment/env/production.env

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - backend


  redis:

    image: redis:8-alpine

    container_name: onlineshop_redis

    restart: unless-stopped

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - backend


  django:

    image: onlineshop-django:latest

    build:
      context: .
      dockerfile: Dockerfile

    container_name: onlineshop_django

    init: true

    restart: unless-stopped

    stop_signal: SIGTERM

    stop_grace_period: 30s

    security_opt:
      - no-new-privileges:true

    env_file:
      - ./deployment/env/production.env

    command: >
      gunicorn
      --config /deployment/gunicorn.conf.py
      onlineshop.wsgi:application

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    expose:
      - "8000"

    volumes:
      - ./static_root:/static_root
      - ./media_root:/media_root
      - ./logs:/logs

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;",
           "urllib.request.urlopen('http://127.0.0.1:8000/health/')"
        ]

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - backend


  nginx:

    image: onlineshop-nginx:latest

    init: true

    build:
      context: .
      dockerfile: deployment/docker/nginx.Dockerfile

    container_name: onlineshop_nginx

    restart: unless-stopped

    stop_signal: SIGQUIT

    stop_grace_period: 30s

    read_only: true

    tmpfs:
      - /var/run
      - /var/cache/nginx

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - NET_BIND_SERVICE

    pids_limit: 100

    ulimits:
      nofile:
        soft: 4096
        hard: 8192

    depends_on:
      django:
        condition: service_healthy

    ports:
      - "80:80"

    volumes:
      - ./static_root:/static_root:ro
      - ./media_root:/media_root:ro
      - ./logs:/logs

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - backend


volumes:

  postgres_data:

  redis_data:


networks:

  backend:
    driver: bridge