version: "3.9"

services:

  postgres:
    image: postgres:17

    container_name: onlineshop_postgres

    restart: unless-stopped

    env_file:
      - ./deployment/env/production.env

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine

    container_name: onlineshop_redis

    restart: unless-stopped

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  django:

    image: onlineshop-django:latest

    build:
      context: .
      dockerfile: Dockerfile

    container_name: onlineshop_django

    restart: unless-stopped

    env_file:
      - ./deployment/env/production.env

    command: >
      gunicorn
      --config deployment/gunicorn.conf.py
      config.wsgi:application

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    expose:
      - "8000"

    volumes:
      - ./onlineshop:/app

      - ./static_root:/static_root

      - ./media_root:/media_root

      - ./logs:/logs

volumes:

  postgres_data:

  redis_data: