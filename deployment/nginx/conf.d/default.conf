upstream django {

    server django:8000;

}


server {

    listen 80;

    server_name _;


    # ----------------------------
    # Static Files
    # ----------------------------
    location /static/ {

        alias /static_root/;

        expires 30d;

        access_log off;

    }


    # ----------------------------
    # Media Files
    # ----------------------------
    location /media/ {

        alias /media_root/;

        expires 7d;

        access_log off;

    }


    # ----------------------------
    # Django
    # ----------------------------
    location / {

        proxy_pass http://django;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;

    }

}